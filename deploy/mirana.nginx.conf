server {
    listen 80;
    listen 443 ssl;
    server_name miranastyle.ir www.miranastyle.ir;

    ssl_certificate /etc/nginx/origin-tls/origin.crt;
    ssl_certificate_key /etc/nginx/origin-tls/origin.key;
    include /etc/nginx/snippets/funmig-security.conf;
    client_max_body_size 20m;

    location /static/ {
        alias "/srv/mirana_poosh/staticfiles/";
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    location /media/ {
        alias "/srv/mirana_poosh/media/";
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:8015;
        include /etc/nginx/snippets/funmig-proxy.conf;
    }
}
